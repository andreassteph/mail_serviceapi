[project]
name = "mail-serviceapi"
version = "0.1.1"
description = "Thin Python client for the mail client's REST service API"
readme = "README.md"
authors = [
    { name = "Andreas Stephanides", email = "st-andreas@gmx.at" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
